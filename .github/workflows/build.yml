# يبني APK على كل push (بعد ما يوصل مشروع Gradle حقيقي عبر unpack-zip.yml أو push مباشر).
# التوقيع: أسرار KEYSTORE_BASE64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD
# أو secrets/signing/keystore.properties في المستودع الخاص. بدون توقيع: APK بمفتاح مؤقت، بدون Release.
# كل push على main بتوقيع صحيح ينشر Release vX.Y.Z-bN من VERSION_NAME في gradle.properties.

name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Check project is present
        id: check
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::لا مشروع Gradle بعد — رفع zip وسيُفك ويُبنى تلقائياً."
          fi

      - name: Set up JDK 17
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.check.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        if: steps.check.outputs.ready == 'true' && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: steps.check.outputs.ready == 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        if: steps.check.outputs.ready == 'true'
        run: |
          NAME=$(basename "$GITHUB_REPOSITORY")
          VERSION=$(grep '^VERSION_NAME=' gradle.properties 2>/dev/null | cut -d= -f2)
          VERSION=${VERSION:-0.0.0}
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/${NAME}-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/*.apk "dist/${NAME}-latest.apk"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::بلا أسرار توقيع — APK موقّع بمفتاح مؤقت، لن يُنشر Release."
          fi
          ls -l dist

      - name: Upload APK artifact
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: steps.check.outputs.ready == 'true' && github.ref_name == 'main' && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NAME=$(basename "$GITHUB_REPOSITORY")
          VERSION=$(grep '^VERSION_NAME=' gradle.properties 2>/dev/null | cut -d= -f2)
          VERSION=${VERSION:-0.0.0}
          TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"
          NOTES="docs/releases/v${VERSION}.md"
          if [ ! -f "$NOTES" ]; then echo "## $NAME $VERSION" > /tmp/notes.md; NOTES=/tmp/notes.md; fi
          gh release create "$TAG" "dist/${NAME}-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk" \
            --title "$NAME $VERSION — بناء $GITHUB_RUN_NUMBER" \
            --notes-file "$NOTES" --target "$(git rev-parse HEAD)" --latest
